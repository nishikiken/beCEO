<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BE CEO - Админ Панель</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 20px;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
}

h1 {
  font-size: 32px;
  color: #38bdf8;
  margin-bottom: 30px;
  text-align: center;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.stat-card {
  background: rgba(15,23,42,.7);
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}

.stat-value {
  font-size: 36px;
  font-weight: 700;
  color: #38bdf8;
  margin-bottom: 8px;
}

.stat-label {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.6);
  text-transform: uppercase;
}

.section {
  background: rgba(15,23,42,.7);
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 30px;
}

.section h2 {
  font-size: 24px;
  color: #38bdf8;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid rgba(148,163,184,.15);
}

th {
  background: rgba(56, 189, 248, 0.1);
  color: #38bdf8;
  font-weight: 600;
}

.btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: .2s;
}

.btn-delete {
  background: rgba(239, 68, 68, 0.2);
  color: #ef4444;
  border: 1px solid rgba(239, 68, 68, 0.4);
}

.btn-delete:hover {
  background: rgba(239, 68, 68, 0.3);
}

.btn-ban {
  background: rgba(251, 146, 60, 0.2);
  color: #fb923c;
  border: 1px solid rgba(251, 146, 60, 0.4);
}

.btn-ban:hover {
  background: rgba(251, 146, 60, 0.3);
}

.btn-unban {
  background: rgba(34, 197, 94, 0.2);
  color: #22c55e;
  border: 1px solid rgba(34, 197, 94, 0.4);
}

.btn-unban:hover {
  background: rgba(34, 197, 94, 0.3);
}

.loading {
  text-align: center;
  padding: 40px;
  color: #38bdf8;
}

.error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #ef4444;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.message {
  max-width: 400px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
</style>
</head>
<body>

<div class="container">
  <h1>🛡️ BE CEO - Админ Панель</h1>

  <div id="error" class="error" style="display: none;"></div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="totalUsers">-</div>
      <div class="stat-label">Пользователей</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalTraces">-</div>
      <div class="stat-label">Следов</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalLikes">-</div>
      <div class="stat-label">Лайков</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="bannedUsers">-</div>
      <div class="stat-label">Забанено</div>
    </div>
  </div>

  <div class="section">
    <h2>📝 Все следы</h2>
    <div id="tracesLoading" class="loading">Загрузка...</div>
    <table id="tracesTable" style="display: none;">
      <thead>
        <tr>
          <th>Username</th>
          <th>Сообщение</th>
          <th>Лайки</th>
          <th>Дата</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="tracesBody"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>👥 Пользователи</h2>
    <div id="usersLoading" class="loading">Загрузка...</div>
    <table id="usersTable" style="display: none;">
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Дата регистрации</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</div>

<script>
// ЗАМЕНИ НА СВОИ ДАННЫЕ SUPABASE
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Загрузка статистики
async function loadStats() {
  try {
    const { data, error } = await supabase.rpc('get_stats');
    if (error) throw error;
    
    document.getElementById('totalUsers').textContent = data.total_users || 0;
    document.getElementById('totalTraces').textContent = data.total_traces || 0;
    document.getElementById('totalLikes').textContent = data.total_likes || 0;
    document.getElementById('bannedUsers').textContent = data.banned_users || 0;
  } catch (error) {
    console.error('Error loading stats:', error);
  }
}

// Загрузка следов
async function loadTraces() {
  try {
    const { data, error } = await supabase
      .from('traces')
      .select('*')
      .order('created_at', { ascending: false });
    
    if (error) throw error;
    
    const tbody = document.getElementById('tracesBody');
    tbody.innerHTML = '';
    
    data.forEach(trace => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${trace.username}</td>
        <td class="message">${trace.message}</td>
        <td>${trace.likes}</td>
        <td>${new Date(trace.created_at).toLocaleString('ru-RU')}</td>
        <td>
          <button class="btn btn-delete" onclick="deleteTrace('${trace.id}')">Удалить</button>
        </td>
      `;
      tbody.appendChild(row);
    });
    
    document.getElementById('tracesLoading').style.display = 'none';
    document.getElementById('tracesTable').style.display = 'table';
  } catch (error) {
    showError('Ошибка загрузки следов: ' + error.message);
  }
}

// Загрузка пользователей
async function loadUsers() {
  try {
    const { data, error } = await supabase
      .from('users')
      .select('*')
      .order('created_at', { ascending: false });
    
    if (error) throw error;
    
    const tbody = document.getElementById('usersBody');
    tbody.innerHTML = '';
    
    data.forEach(user => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${user.username}</td>
        <td>${user.email || '-'}</td>
        <td>${new Date(user.created_at).toLocaleString('ru-RU')}</td>
        <td>${user.is_banned ? '🚫 Забанен' : '✅ Активен'}</td>
        <td>
          ${user.is_banned 
            ? `<button class="btn btn-unban" onclick="unbanUser('${user.id}')">Разбанить</button>`
            : `<button class="btn btn-ban" onclick="banUser('${user.id}')">Забанить</button>`
          }
        </td>
      `;
      tbody.appendChild(row);
    });
    
    document.getElementById('usersLoading').style.display = 'none';
    document.getElementById('usersTable').style.display = 'table';
  } catch (error) {
    showError('Ошибка загрузки пользователей: ' + error.message);
  }
}

// Удаление следа
async function deleteTrace(id) {
  if (!confirm('Удалить этот след?')) return;
  
  try {
    const { error } = await supabase
      .from('traces')
      .delete()
      .eq('id', id);
    
    if (error) throw error;
    
    await loadTraces();
    await loadStats();
  } catch (error) {
    showError('Ошибка удаления: ' + error.message);
  }
}

// Бан пользователя
async function banUser(id) {
  if (!confirm('Забанить этого пользователя?')) return;
  
  try {
    const { error } = await supabase
      .from('users')
      .update({ is_banned: true })
      .eq('id', id);
    
    if (error) throw error;
    
    await loadUsers();
    await loadStats();
  } catch (error) {
    showError('Ошибка бана: ' + error.message);
  }
}

// Разбан пользователя
async function unbanUser(id) {
  try {
    const { error } = await supabase
      .from('users')
      .update({ is_banned: false })
      .eq('id', id);
    
    if (error) throw error;
    
    await loadUsers();
    await loadStats();
  } catch (error) {
    showError('Ошибка разбана: ' + error.message);
  }
}

// Показать ошибку
function showError(message) {
  const errorDiv = document.getElementById('error');
  errorDiv.textContent = message;
  errorDiv.style.display = 'block';
  setTimeout(() => errorDiv.style.display = 'none', 5000);
}

// Инициализация
document.addEventListener('DOMContentLoaded', () => {
  loadStats();
  loadTraces();
  loadUsers();
  
  // Обновление каждые 30 секунд
  setInterval(() => {
    loadStats();
    loadTraces();
    loadUsers();
  }, 30000);
});
</script>

</body>
</html>
